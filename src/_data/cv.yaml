teaching:
  # Each course gets its own page at /teaching/<slug>/.
  # `code` must match the `course:` field of that course's lecture notes.
  - slug: ece6357
    code: ECE 6357
    course: ECE 6357 Advanced Image Processing
    term: Fall 2026
    where: Vanderbilt University
    role: Instructor
    with: Co-taught with Yihao Liu.
    current: true
    about: |
      A graduate course on the mathematical and algorithmic foundations of (medical) image analysis, from statistical intensity models and segmentation to image registration.

      The course works through primary literature and hands-on implementation: translating ideas into mathematical models, implementing them correctly, and understanding why and when they work, or break.
  - slug: es1400
    code: ES 1400
    course: ES 1400 Introduction to Engineering, ECE Module
    term: Fall 2024, Fall 2025
    where: Vanderbilt University
    role: Instructor
    with: Co-taught with Bennett Landman (2024, 2025) and Zhiyuan Li (2024).
    about: |
      An introduction to engineering through hands-on projects, lectures, and lab sessions: Python on the Raspberry Pi, AI and reinforcement learning, pulse code modulation, servo control, encryption, and communication systems.
