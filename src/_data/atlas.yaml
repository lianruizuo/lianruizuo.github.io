          - { cite: "G. Balakrishnan et al., “VoxelMorph: a learning framework for deformable medical image registration,” IEEE TMI, 2019.", doi: 10.1109/TMI.2019.2897538 }
          - { cite: "J. Chen et al., “TransMorph: Transformer for unsupervised medical image registration,” Medical Image Analysis, 2022.", doi: 10.1016/j.media.2022.102615 }
          - { cite: "Y. Liu et al., “Vector field attention for deformable image registration,” Journal of Medical Imaging, 2024.", doi: 10.1117/1.JMI.11.6.064001 }
      - id: regeval
        ch: "4.6"
        papers:
          - { cite: "Medical Image Analysis, 2026.", url: "https://www.sciencedirect.com/science/article/abs/pii/S1361841526002446" }

  - code: ES 1400
    title: Introduction to Engineering, ECE Module
    term: Fall 2024, Fall 2025
    credits: Co-taught with Bennett Landman (2024, 2025) and Zhiyuan Li (2024). Bennett Landman leads sessions 1, 5 and 9, and session 2 with Zhiyuan Li; sessions 6 and 12 were developed with Zhiyuan Li.
    route:
      - { id: dimension,  session: The curious goat, about: "What do we actually mean when we measure something? And what does a corner case mean once data has many dimensions?" }
      - { id: oxo,        session: "Hello, world", about: "Hands on with tic-tac-toe, and a tour of electrical and computer engineering through sensing, interfaces, software and AI." }
      - { id: tdlearning, session: Reinforcement learning, about: "How do people learn? The same habits train a computer agent: look far ahead to balance long- and short-term reward, reflect to update what each choice is expected to bring, and balance exploring with exploiting." }
      - { id: menace,     session: Learning to play, lab: true, about: "Train a tic-tac-toe agent on a Raspberry Pi with reinforcement learning, and watch its choices improve." }
      - { id: feedback,   session: Pulses that move things, about: "A small motor spins. Add gears, a sensor and a controller, and it moves to a position on purpose." }
      - { id: magstripe,  session: A card full of clues, about: "A card is a key you carry. Follow its information from the stripe or antenna to the reader, and ask what the reader can really know." }
      - { id: publickey,  session: "Keys, locks and secrets", about: "How encryption protects a message, and how authentication checks who is allowed in." }
      - { id: raspi,      session: Build a candy safe, lab: true, about: "Bring code, sensors, outputs and decisions together in one Raspberry Pi project." }
      - { id: radio,      session: A message on a wave, about: "Follow a signal through a radio system as it carries a message across space." }
      - { id: sonar,      session: Listening with ultrasound, about: "Send a pulse of sound above human hearing, and use its echo to estimate distance." }
      - { id: theremin,   session: Play the space around you, lab: true, about: "Turn distance into pitch, and build an instrument inspired by the theremin." }
      - { id: tcpip,      session: A hello across the network, about: "Send a message between computers, and discover the agreement that lets it arrive." }
