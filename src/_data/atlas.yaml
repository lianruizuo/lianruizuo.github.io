# A course is its route through the atlas, in teaching order.
#   ch       the chapter (ECE 6357); session/about/lab: the session (ES 1400)
#   papers   what the session reads, listed on the course page
#   note     one line, e.g. a guest speaker
courses:
  - code: ECE 6357
    title: Advanced Image Processing
    term: Fall 2026
    route:
      - { id: otsu,        ch: "2.1" }
      - { id: reddi,       ch: "2.2" }
      - { id: kmeans,      ch: "2.3" }
      - { id: fcm,         ch: "2.4" }
      - { id: mixtures,    ch: "2.5" }
      - { id: biasfield,   ch: "2.6" }
      - { id: canny,       ch: "3.1" }
      - { id: snakes,      ch: "3.2" }
      - { id: gvf,         ch: "3.3" }
      - id: levelsets
        ch: "3.4"
        papers:
          - { cite: "R. Malladi, J. A. Sethian and B. C. Vemuri, “Shape modeling with front propagation: a level set approach,” IEEE TPAMI, 1995.", doi: 10.1109/34.368173 }
          - { cite: "T. F. Chan and L. A. Vese, “Active contours without edges,” IEEE Transactions on Image Processing, 2001.", doi: 10.1109/83.902291 }
      - id: modernseg
        ch: "3.5"
        papers:
          - { cite: "O. Ronneberger, P. Fischer and T. Brox, “U-Net: convolutional networks for biomedical image segmentation,” MICCAI, 2015.", doi: 10.1007/978-3-319-24574-4_28 }
          - { cite: "F. Isensee et al., “nnU-Net: a self-configuring method for deep learning-based biomedical image segmentation,” Nature Methods, 2021.", doi: 10.1038/s41592-020-01008-z }
          - { cite: "A. Kirillov et al., “Segment anything,” ICCV, 2023.", url: "https://arxiv.org/abs/2304.02643" }
      - id: segeval
        ch: "3.6"
        papers:
          - { cite: "A. Carass et al., “Longitudinal multiple sclerosis lesion segmentation: resource and challenge,” NeuroImage, vol. 148, pp. 77–102, 2017.", url: "https://www.sciencedirect.com/science/article/abs/pii/S1053811916307819" }
      - { id: interp,      ch: "4.1" }
      - { id: regframe,    ch: "4.2a–c" }
      - { id: mi,          ch: "4.2d" }
      - { id: opticalflow, ch: "4.3" }
      - { id: demons,      ch: "4.4" }
