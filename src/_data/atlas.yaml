# The atlas.
#
# Nothing is placed by hand: a method sits at the year of its primary source,
# and its height is chosen automatically so labels never collide.
# A course is an ordered list of methods (its route). Picking it on the map
# lines those methods up in teaching order.
# Crossings (a boundary of one method that another method crosses) are listed
# in each written node's front matter and shown on that node's page.
#
# To plan a node, add one entry under `nodes`. To write it, create
# src/teaching/atlas/<id>/index.md with `node: <id>`; it turns solid on the map.
# To remove a node, delete its entry (and its folder).

# The four places an error can live. Code and search are bugs; criterion and reach are boundaries.
layers:
  - id: code
    name: Code
    kind: bug
    test: The implementation does not compute what the math says.
    fix: Fix the code.
  - id: search
    name: Search
    kind: bug
    test: The optimizer misses the optimum of its own criterion.
    fix: Fix the optimizer, or how it starts.
  - id: criterion
    name: Criterion
    kind: boundary
    test: The criterion is optimized, but its best answer is not the right one here.
    fix: Change what is optimized.
  - id: reach
    name: Reach
    kind: boundary
    test: Even the best answer the method can express is wrong.
    fix: Let it see more, or say more.

nodes:
  - { id: kmeans,     title: k-means,                  year: 1967, source: MacQueen }
  - { id: mixtures,   title: Mixtures and EM,          year: 1977, source: "Dempster, Laird and Rubin" }
  - { id: otsu,       title: Otsu thresholding,        year: 1979, source: Otsu }
  - { id: fcm,        title: Fuzzy c-means,            year: 1981, source: Bezdek }
  - { id: reddi,      title: Multilevel thresholds,    year: 1984, source: "Reddi, Rudin and Keshavan" }
  - { id: canny,      title: Canny edges,              year: 1986, source: Canny }
  - { id: biasfield,  title: Bias field correction,    year: 1999, source: "Van Leemput et al." }
  - { id: graphcut,   title: Graph cuts,               year: 2004, source: "Boykov and Kolmogorov" }
  - { id: snakes,     title: Snakes,                   year: 1988, source: "Kass, Witkin and Terzopoulos" }
  - { id: levelsets,  title: Level sets,               year: 1995, source: "Malladi, Sethian and Vemuri" }
  - { id: gvf,        title: Gradient vector flow,     year: 1998, source: "Xu and Prince" }
  - { id: chanvese,   title: Contours without edges,   year: 2001, source: "Chan and Vese" }
  - { id: landmarks,  title: Landmark registration,    year: 1988, source: Goshtasby }
  - { id: demons,     title: Demons,                   year: 1998, source: Thirion }
  - { id: ffd,        title: Free-form deformations,   year: 1999, source: "Rueckert et al." }
  - { id: asm,        title: Active shape models,      year: 1995, source: "Cootes et al." }

# A course is a route through the atlas, in teaching order.
courses:
  - code: ECE 6357
    title: Advanced Image Processing
    term: Fall 2026
    route: [otsu, reddi, kmeans, fcm, mixtures, biasfield, canny, snakes, gvf, asm, levelsets, chanvese, graphcut, landmarks, demons, ffd]
